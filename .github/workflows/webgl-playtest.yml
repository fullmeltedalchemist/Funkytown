name: WebGL playtest
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'tests/**'
      - 'index.html'
      - 'style.css'
      - '.github/workflows/webgl-playtest.yml'
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 --bind 127.0.0.1 &
          mkdir -p playtest-results
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          try{
            for(const profile of [
              {name:'desktop',viewport:{width:960,height:640}},
              {name:'touch',viewport:{width:390,height:844},hasTouch:true,isMobile:true}
            ]){
              const {name,...options}=profile;
              const page=await browser.newPage(options);
              const errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              try{
                if(name==='desktop'){
                  // Set up a post-Chapter-3 save at the high bank. The drain still uses the normal Use button.
                  await page.addInitScript(()=>{
                    localStorage.setItem('bellwether-chapters-v1','{"stage":4}');
                    localStorage.setItem('bellwether-story-v1','4');
                  });
                  await page.route('**/src/main.js',async route=>{
                    const response=await route.fetch();
                    const code=await response.text();
                    const marker='let yaw=.34,pitch=-.11,last=';
                    assert(code.includes(marker));
                    const fixture=`
                      const drain=salvage.control;
                      const testX=drain.x-.25,testZ=drain.z-1;
                      walker.teleport([testX,height(testX,testZ)+.9,testZ]);
                      let yaw=Math.atan2(testX-drain.x,testZ-drain.z),
                        pitch=Math.atan2(drain.y-walker.current.y-.58,Math.hypot(drain.x-testX,drain.z-testZ)),last=`;
                    const pose=`
                      window.__poseFord=stop=>{
                        const point=stop==='radio'?fordRescue.radio:fordRescue.high;
                        const x=point.x,z=point.z+1.55,y=height(x,z)+.89;
                        walker.teleport([x,y,z]);
                        yaw=0;
                        pitch=Math.atan2(point.y-y-.58,1.55);
                      };
                    `;
                    await route.fulfill({response,body:code.replace(marker,fixture)
                      .replace('renderer.setAnimationLoop(now=>{',pose+'renderer.setAnimationLoop(now=>{')});
                  });
                }
                if(name==='touch'){
                  await page.addInitScript(()=>{
                    const NativeAudioContext=window.AudioContext;
                    window.AudioContext=class extends NativeAudioContext {
                      constructor(){super();window.__gameAudio=this;}
                    };
                    localStorage.setItem('bellwether-bag-v1-records',JSON.stringify([
                      ['pond-records',{name:'Missing-person ledger',description:'Seeded salvage reward',category:'Keepsakes'}]
                    ]));
                  });
                  await page.route('**/src/main.js',async route=>{
                    const response=await route.fetch();
                    const code=await response.text();
                    const marker='renderer.setAnimationLoop(now=>{';
                    assert(code.includes(marker));
                    const fixture=`
                      window.__poseSecondAddress=(stop,target)=>{
                        const x=secondAddress.x,z=secondAddress.z,y=secondAddress.y;
                        const positions={
                          porch:[x,y+1.14,z+4],
                          room:[x,y+1.14,z+.34],
                          mailbox:[address.mailbox.x,height(address.mailbox.x,address.mailbox.z+1.55)+.85,address.mailbox.z+1.55],
                          post:[address.drop.x,height(address.drop.x,address.drop.z+1.6)+.9,address.drop.z+1.6]
                        };
                        const points={
                          door:address.door.visual.position,clock:address.clockPoint,
                          receiver:address.trayControl,post:address.drop,
                          resident:address.mailbox.clone().add(new T.Vector3(0,1,0))
                        };
                        const place=positions[stop];
                        const aim=points[target].clone().sub(new T.Vector3(place[0],place[1]+.58,place[2]));
                        walker.teleport(place);
                        yaw=Math.atan2(-aim.x,-aim.z);
                        pitch=Math.atan2(aim.y,Math.hypot(aim.x,aim.z));
                      };
                      window.__poseFounders=stop=>{
                        const point=stop==='float'?founders.recorder:stop==='receipt'?founders.receipt:
                          stop==='ring'?founders.ringPoint:
                          new T.Vector3().copy(founders.case.body.translation()).add(new T.Vector3(0,.15,0));
                        const x=point.x+(stop==='case'?.9:0),z=point.z+(stop==='float'?.46:stop==='case'?1.3:1.65);
                        const y=stop==='float'?founders.float.position.y+1.53:height(x,z)+.87;
                        const aim=point.clone().sub(new T.Vector3(x,y+.58,z));
                        walker.teleport([x,y,z]);
                        yaw=Math.atan2(-aim.x,-aim.z);
                        pitch=Math.atan2(aim.y,Math.hypot(aim.x,aim.z));
                      };
                    `;
                    await route.fulfill({response,body:code.replace(marker,fixture+marker)});
                  });
                }
                await page.goto('http://127.0.0.1:8080',{waitUntil:'domcontentloaded'});
                assert(await page.evaluate(()=>Boolean(document.createElement('canvas').getContext('webgl2'))),'WebGL2 unavailable');
                await page.getByRole('button',{name:'Walk the ridge'}).waitFor({timeout:90000});
                if(name==='touch'){
                  await page.locator('#touch-mode').tap();
                  await page.locator('#touch').waitFor({state:'visible'});
                  await page.waitForFunction(()=>window.__gameAudio?.state==='running');
                  await page.evaluate(()=>{
                    Object.defineProperty(document,'hidden',{configurable:true,value:true});
                    document.dispatchEvent(new Event('visibilitychange'));
                  });
                  await page.waitForFunction(()=>window.__gameAudio.state==='suspended');
                  await page.evaluate(()=>{
                    delete document.hidden;
                    document.dispatchEvent(new Event('visibilitychange'));
                  });
                  await page.waitForFunction(()=>window.__gameAudio.state==='running');
                  await page.evaluate(()=>window.dispatchEvent(new Event('pagehide')));
                  await page.waitForFunction(()=>window.__gameAudio.state==='suspended');
                  await page.evaluate(()=>window.dispatchEvent(new Event('pageshow')));
                  await page.waitForFunction(()=>window.__gameAudio.state==='running');
                  const kit=page.locator('#tool-panel');
                  await kit.waitFor({state:'hidden'});
                  const tapTool=async selector=>{
                    await page.getByRole('button',{name:'Tools',exact:true}).tap();
                    await kit.waitFor({state:'visible'});
                    await page.locator(selector).tap();
                    await kit.waitFor({state:'hidden'});
                  };
                  await tapTool('#lantern-button');
                  await page.getByText('Signal lantern deployed.',{exact:false}).waitFor();
                  await tapTool('#lantern-button');
                  await page.getByText('Signal lantern recalled.',{exact:false}).waitFor();
                  await tapTool('#weapon-button');
                  await page.getByText('Flare equipped.',{exact:true}).waitFor();
                  await tapTool('#weapon-button');
                  await page.getByText('Slingshot equipped.',{exact:true}).waitFor();
                  await tapTool('#weapon-button');
                  await page.getByText('Lever rifle equipped.',{exact:true}).waitFor();
                  await tapTool('#speaker-button');
                  await page.getByText('Record a contact sample with Mic first.',{exact:true}).waitFor();
                  await tapTool('#drink-button');
                  await page.getByText('Canteen empty.',{exact:false}).waitFor();
                  await page.locator('#bag-button').tap();
                }else{
                  await page.locator('#touch-mode').click();
                  await page.locator('#touch').waitFor({state:'visible'});
                  await page.locator('#bag-button').click();
                }
                await page.locator('#bag-panel').waitFor({state:'visible'});
                if(name==='desktop'){
                  await page.locator('#bag-button').click();
                  await page.locator('#hint').filter({hasText:'Drain the submerged street'}).waitFor();
                  await page.locator('#use').click();
                  await page.locator('#guide').filter({hasText:'Choose one load and get uphill'}).waitFor();
                  await page.evaluate(()=>window.__poseFord('radio'));
                  await page.locator('#hint').filter({hasText:'ford emergency radio'}).waitFor();
                  await page.locator('#use').click();
                  await page.evaluate(()=>window.__poseFord('line'));
                  await page.locator('#hint').filter({hasText:'Pull the high-bank tow line'}).waitFor();
                  await page.locator('#use').click();
                  await page.locator('#bag-button').click();
                  await page.getByText('Conflicting ford dispatch',{exact:true}).waitFor();
                }
                if(name==='touch'){
                  await page.getByText('Missing-person ledger',{exact:true}).waitFor();
                  await page.locator('#bag-button').tap();
                  const aimAndUse=async(stop,target,label)=>{
                    await page.evaluate(([stop,target])=>window.__poseSecondAddress(stop,target),[stop,target]);
                    await page.locator('#hint').filter({hasText:label}).waitFor();
                    await page.locator('#use').tap();
                  };
                  await aimAndUse('porch','door','utility worker');
                  await page.locator('#guide').filter({hasText:'Inspect the stopped clock'}).waitFor();
                  await aimAndUse('room','clock','Inspect the stopped kitchen clock');
                  await aimAndUse('room','receiver','Release the brass survey ball');
                  await page.locator('#guide').filter({hasText:'receiver on'}).waitFor({timeout:60000});
                  await aimAndUse('room','receiver','Switch on the receiver and repeat the test');
                  await page.locator('#guide').filter({hasText:'Compare records at the post office'}).waitFor({timeout:60000});
                  await aimAndUse('mailbox','resident','Talk to the resident at the mailbox');
                  await page.locator('#guide').filter({hasText:'Optional getaway'}).waitFor();
                  await aimAndUse('post','post','Compare the two addresses');
                  await page.locator('#bag-button').tap();
                  await page.getByText('Two addresses, one evacuee',{exact:true}).waitFor();
                  await page.getByText('Utility cover exposed',{exact:true}).waitFor();
                  await page.locator('#bag-button').tap();
                  await page.evaluate(()=>window.__poseFounders('receipt'));
                  await page.locator('#hint').filter({hasText:'Read the backup delivery receipt'}).waitFor();
                  await page.locator('#use').tap();
                  await page.locator('#guide').filter({hasText:'Grapple the brass ring'}).waitFor();
                  await page.evaluate(()=>window.__poseFounders('float'));
                  await page.locator('#hint').filter({hasText:'Listen to the recorder aboard the parade float'}).waitFor();
                  await page.locator('#use').tap();
                  await page.getByText('The recorder catches an order',{exact:false}).waitFor();
                  await page.evaluate(()=>window.__poseFounders('ring'));
                  await page.locator('#hint').filter({hasText:'Grapple the archive shutter ring'}).waitFor();
                  await page.locator('#grapple').tap();
                  await page.locator('#guide').filter({hasText:'Pick up the archive tape case'}).waitFor();
                  await page.evaluate(()=>window.__poseFounders('case'));
                  await page.locator('#hint').filter({hasText:'Archive tape case'}).waitFor();
                  await page.locator('#use').tap();
                  await page.locator('#guide').filter({hasText:'Take the tape case to the clerk'}).waitFor();
                }
                assert.deepEqual(errors,[]);
              }catch(error){
                console.warn(name+' browser state:',await page.locator('#hint, #guide, #status, #notice').allTextContents());
                throw error;
              }finally{
                await page.screenshot({path:'playtest-results/'+name+'.png',timeout:15000})
                  .catch(error=>console.warn(name+' screenshot failed:',error.message));
                await page.close();
              }
            }
          }finally{
            await browser.close();
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funkytown-playtest
          path: playtest-results/
